name: macOS Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test search engine
        run: swift test
      - name: Exercise filesystem lifecycle
        run: swift run Anyseek --self-test
      - name: Build application
        run: bash scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Anyseek-macos-universal
          path: |
            dist/Anyseek-macos.zip
            dist/SHA256SUMS.txt
