name: macOS Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test search engine
        run: swift test
      - name: Exercise filesystem lifecycle
        run: swift run Anyseek --self-test
      - name: Build application
        run: bash scripts/build-app.sh
      - name: Verify drag-and-drop installer
        run: |
          hdiutil attach -readonly -mountpoint "/Volumes/Anyseek-CI" dist/Anyseek.dmg
          test -x "/Volumes/Anyseek-CI/Anyseek.app/Contents/MacOS/Anyseek"
          test -f "/Volumes/Anyseek-CI/Anyseek.app/Contents/Resources/Anyseek.icns"
          test "$(readlink "/Volumes/Anyseek-CI/Applications")" = /Applications
          codesign --verify --deep --strict "/Volumes/Anyseek-CI/Anyseek.app"
          .build/arm64-apple-macosx/debug/Anyseek --list-auto-roots > "$RUNNER_TEMP/roots.json"
          python3 -c 'import json,os; roots=json.load(open(os.environ["RUNNER_TEMP"]+"/roots.json")); assert "/" in roots; assert "/Volumes/Anyseek-CI" in roots, roots'
          hdiutil detach "/Volumes/Anyseek-CI"
      - name: Render native window
        run: python3 -c 'import subprocess; subprocess.run(["dist/Anyseek.app/Contents/MacOS/Anyseek", "--ui-smoke-test"], check=True, timeout=45)'
      - uses: actions/upload-artifact@v4
        with:
          name: Anyseek-macos-universal
          path: |
            dist/Anyseek-macos.zip
            dist/Anyseek.dmg
            dist/SHA256SUMS.txt
            dist/Anyseek-window.png
      - name: Publish tested Mac download
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.3.0-build.${GITHUB_RUN_NUMBER}" dist/Anyseek.dmg dist/Anyseek-macos.zip dist/SHA256SUMS.txt dist/Anyseek-window.png --target "$GITHUB_SHA" --prerelease --title "Anyseek 0.3.0 · build ${GITHUB_RUN_NUMBER}" --notes-file scripts/release-notes.md
