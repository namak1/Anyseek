name: macOS Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test search engine
        run: swift test
      - name: Exercise filesystem lifecycle
        run: swift run Anyseek --self-test
      - name: Build application
        run: bash scripts/build-app.sh
      - name: Render native window
        run: python3 -c 'import subprocess; subprocess.run(["dist/Anyseek.app/Contents/MacOS/Anyseek", "--ui-smoke-test"], check=True, timeout=45)'
      - uses: actions/upload-artifact@v4
        with:
          name: Anyseek-macos-universal
          path: |
            dist/Anyseek-macos.zip
            dist/SHA256SUMS.txt
            dist/Anyseek-window.png
      - name: Publish tested Mac download
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.2.0-build.${GITHUB_RUN_NUMBER}" dist/Anyseek-macos.zip dist/SHA256SUMS.txt dist/Anyseek-window.png --target "$GITHUB_SHA" --prerelease --title "Anyseek 0.2.0 · build ${GITHUB_RUN_NUMBER}" --notes-file scripts/release-notes.md
